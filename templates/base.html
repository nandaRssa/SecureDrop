<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SecureDrop - Aplikasi Enkripsi File dan Pengujian Keamanan Kriptografi Modern">
  <title>{% block title %}SecureDrop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-icon">SD</div>
        <h1 class="brand-title">SecureDrop</h1>
        <span class="badge-role">Orang 1 — Core Encryption</span>
      </div>
      <div class="header-tags">
        <span class="badge-tag">Tahap 1: Setup & UI</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container app-content">
    
    <!-- Main Navigation Bar -->
    <nav class="app-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        <li class="nav-item">
          <a href="{{ url_for('main.encrypt') }}" class="nav-link {% if active_page == 'encrypt' %}active{% endif %}">
            <span>Encrypt & Send</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('main.decrypt') }}" class="nav-link {% if active_page == 'decrypt' %}active{% endif %}">
            <span>Receive & Decrypt</span>
            <span class="nav-badge">Tahap 2</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="{{ url_for('main.testing') }}" class="nav-link {% if active_page == 'testing' %}active{% endif %}">
            <span>Security Testing</span>
            <span class="nav-badge">Tahap 3</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Page Body Content -->
    {% block content %}{% endblock %}

  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="container footer-inner">
      <span>SecureDrop — Sistem Kriptografi & Keamanan File Modern</span>
      <span>Stage 1: Basic Architecture & UI</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
